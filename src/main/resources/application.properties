server.port=${PORT:8086}
server.address=0.0.0.0
spring.application.name=Quentity
quentity.app.id=com.example.quentity
#If the application is deployed on a server, set the address of the server here.
#Note: If your server uses http (development purposes) add android:usesCleartextTraffic="true" to the <application> tag in AndroidManifest.xml usually under mobile/my-app/android/app/src/main/AndroidManifest.xml
quentity.app.url=http://192.168.0.6:8086
logging.level.org.atmosphere=warn
spring.mustache.check-template-location=false
# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true
# MariaDB configuration.
spring.datasource.url=jdbc:mariadb://localhost:3306/vaadinstart
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.master,com.flowingcode
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE
org.hibernate.search.backend.io.write-concurrency=20
org.hibernate.search.backend.indexing.queue_count=20
org.hibernate.search.backend.indexing.max_concurrent_requests=20
org.hibernate.search=DEBUG
org.apache.lucene=DEBUG
spring.web.encoding.charset=UTF-8
spring.web.encoding.enabled=true
spring.web.encoding.force=true
spring.jpa.properties.dialect.storage_engine=innodb
jwt.secret=QuentitySecretKeyPleaseChangeItQuentitySecretKeyPleaseChangeIt
spring.profiles.active=native
